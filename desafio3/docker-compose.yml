version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: desafio3-db
    environment:
      POSTGRES_DB: desafio3_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: desafio3-cache
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: desafio3-web
    environment:
      DB_HOST: db
      DB_NAME: desafio3_db
      DB_USER: admin
      DB_PASSWORD: senha123
      REDIS_HOST: cache
      REDIS_PORT: 6379
    ports:
      - "5000:5000"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
    name: desafio3_postgres_data

networks:
  app-network:
    driver: bridge
    name: desafio3-network


